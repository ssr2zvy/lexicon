# Conformance matrix declaring every requirement row the contract and
# specifications demand. The schema is fixed by
# `automation/conformance-matrix/src/lib.rs`:
#
#   schema_version = 1
#   [[requirement]]
#   id = "..."                 # unique across this file
#   authority = "<file>#<section>"
#   implementation = ["<file>:<symbol>", ...]   # at least one entry
#   tests = ["<target>::<name>", ...]            # at least one entry
#   platforms = ["<platform>", ...]              # at least one entry
#   status = "not implemented | partial | implemented, unverified | conformant | intentionally deferred"
#   durable_evidence = "<workflow + artifact/run URL>"   # required when status = conformant
#
# `cargo run --locked -p lexicon-conformance-matrix -- check workspace/specs/conformance.toml`
# performs every structural rule above. With LEXICON_CONFORMANCE_TEST_LIST
# pointing at `cargo test --workspace -- --list` output, it also verifies
# each named test exists.

schema_version = 1

