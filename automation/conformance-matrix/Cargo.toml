[package]
name = "lexicon-conformance-matrix"
version = "0.1.0"
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Conformance-matrix checker for workspace/specs/conformance.toml"
publish = false

[[bin]]
name = "lexicon-conformance-matrix"
path = "src/main.rs"

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
