[package]
name = "lexicon-bundle"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tar = "0.4"
xz2 = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
